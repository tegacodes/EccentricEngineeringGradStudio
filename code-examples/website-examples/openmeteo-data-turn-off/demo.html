<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <pre id="fulldata"></pre>
    <script>
      async function getWeather() {
        //function to get weather data. Async means it will take time to get the data back from the server. It doesnt happen instantly.
        const lat = 40.71,
          lon = -74.01; // NYC
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,wind_direction_10m,wind_speed_10m,precipitation,weather_code`; //this is the url that we are going to use to get the weather data. It is using the lat and lon variables to get the weather for NYC.
        const response = await fetch(url); //this is asking a server for data - same as a browser loading a page.
        const data = await response.json(); //awaiting for the data to come back from the server and then converting it into a format that we can use in our code.
        console.log(data); // open browser dev tools > Console to see this

        //prettier-ignore
        document.querySelector("#fulldata").textContent = JSON.stringify(data, null, 2,);
      }

      getWeather();
    </script>
  </body>
</html>
